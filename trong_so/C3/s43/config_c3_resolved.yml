__include__:
- /content/KTLN_exp2/code_baselines/DEIMv2/configs/dataset/coco_detection.yml
- /content/KTLN_exp2/code_baselines/DEIMv2/configs/runtime.yml
- /content/KTLN_exp2/code_baselines/DEIMv2/configs/base/dataloader.yml
- /content/KTLN_exp2/code_baselines/DEIMv2/configs/base/optimizer.yml
- /content/KTLN_exp2/code_baselines/DEIMv2/configs/base/deimv2.yml
output_dir: /content/runs/S1/C3/s43
seed: 43
num_classes: 48
remap_mscoco_category: false
eval_spatial_size:
- 1024
- 1024
HGNetv2:
  name: B0
  return_idx:
  - 2
  - 3
  freeze_at: -1
  freeze_norm: false
  use_lab: true
  pretrained: false
HybridEncoder:
  in_channels:
  - 512
  - 1024
  feat_strides:
  - 16
  - 32
  hidden_dim: 128
  use_encoder_idx:
  - 1
  dim_feedforward: 512
  expansion: 0.34
  depth_mult: 0.5
  version: dfine
DEIMTransformer:
  feat_channels:
  - 128
  - 128
  feat_strides:
  - 16
  - 32
  hidden_dim: 128
  num_levels: 2
  num_points:
  - 6
  - 6
  num_layers: 3
  eval_idx: -1
  dim_feedforward: 512
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*backbone)(?!.*norm|bn).*$
    lr: 0.0002
  - params: ^(?=.*backbone)(?=.*norm|bn).*$
    lr: 0.0002
    weight_decay: 0.0
  - params: ^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$
    weight_decay: 0.0
  lr: 0.0004
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
epoches: 200
flat_epoch: 7800
no_aug_epoch: 12
lr_gamma: 1.0
train_dataloader:
  dataset:
    transforms:
      ops:
      - type: Mosaic
        output_size: 512
        rotation_range: 10
        translation_range:
        - 0.1
        - 0.1
        scaling_range:
        - 0.5
        - 1.5
        probability: 1.0
        fill_value: 0
        use_cache: true
        max_cached_images: 50
        random_pop: true
      - type: RandomZoomOut
        fill: 0
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: Resize
        size:
        - 1024
        - 1024
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        epoch:
        - 4
        - 98
        - 188
    img_folder: /content/KTLN_exp2/data/S1/train/images
    ann_file: /content/KTLN_exp2/data/S1_COCO_C3/instances_train.json
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1024
    base_size_repeat: null
    stop_epoch: 188
    ema_restart_decay: 0.9999
    mixup_epochs:
    - 4
    - 98
    copyblend_prob: 0.4
    copyblend_epochs:
    - 4
    - 98
    area_threshold: 100
    num_objects: 3
    with_expand: true
    expand_ratios:
    - 0.1
    - 0.25
  shuffle: true
  total_batch_size: 16
  num_workers: 4
val_dataloader:
  dataset:
    transforms:
      ops:
      - type: Resize
        size:
        - 1024
        - 1024
      - type: ConvertPILImage
        dtype: float32
        scale: true
    img_folder: /content/KTLN_exp2/data/S1/val/images
    ann_file: /content/KTLN_exp2/data/S1_COCO_C3/instances_val.json
  shuffle: false
  total_batch_size: 16
  num_workers: 4
test_dataloader:
  dataset:
    transforms:
      ops:
      - type: Resize
        size:
        - 1024
        - 1024
      - type: ConvertPILImage
        dtype: float32
        scale: true
    img_folder: /content/KTLN_exp2/data/S1/test/images
    ann_file: /content/KTLN_exp2/data/S1_COCO_C3/instances_test.json
  shuffle: false
  total_batch_size: 16
  num_workers: 4
DEIMCriterion:
  matcher:
    change_matcher: true
    iou_order_alpha: 4.0
    matcher_change_epoch: 136
